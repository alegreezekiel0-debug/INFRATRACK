<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Gear background -->
  <g transform="translate(100,80)">
    <!-- Gear teeth -->
    <g fill="#1e40af">
      <path d="M-48,-48 L-38,-48 L-33,-33 L-43,-23 L-48,-28 Z"/>
      <path d="M-48,-48 L-38,-48 L-33,-33 L-43,-23 L-48,-28 Z" transform="rotate(30)"/>
      <path d="M-48,-48 L-38,-48 L-33,-33 L-43,-23 L-48,-28 Z" transform="rotate(60)"/>
      <path d="M-48,-48 L-38,-48 L-33,-33 L-43,-23 L-48,-28 Z" transform="rotate(90)"/>
      <path d="M-48,-48 L-38,-48 L-33,-33 L-43,-23 L-48,-28 Z" transform="rotate(120)"/>
      <path d="M-48,-48 L-38,-48 L-33,-33 L-43,-23 L-48,-28 Z" transform="rotate(150)"/>
      <path d="M-48,-48 L-38,-48 L-33,-33 L-43,-23 L-48,-28 Z" transform="rotate(180)"/>
      <path d="M-48,-48 L-38,-48 L-33,-33 L-43,-23 L-48,-28 Z" transform="rotate(210)"/>
      <path d="M-48,-48 L-38,-48 L-33,-33 L-43,-23 L-48,-28 Z" transform="rotate(240)"/>
      <path d="M-48,-48 L-38,-48 L-33,-33 L-43,-23 L-48,-28 Z" transform="rotate(270)"/>
      <path d="M-48,-48 L-38,-48 L-33,-33 L-43,-23 L-48,-28 Z" transform="rotate(300)"/>
      <path d="M-48,-48 L-38,-48 L-33,-33 L-43,-23 L-48,-28 Z" transform="rotate(330)"/>
    </g>
    <!-- Gear body -->
    <circle cx="0" cy="0" r="40" fill="#2563eb"/>
    <circle cx="0" cy="0" r="33" fill="#6b7280"/>
    <circle cx="0" cy="0" r="28" fill="#9ca3af"/>
  </g>
  <!-- Wrench -->
  <g transform="translate(100,80) rotate(-30)">
    <rect x="-3.5" y="-32" width="7" height="45" rx="2.5" fill="#d1d5db" stroke="#9ca3af" stroke-width="0.8"/>
    <path d="M-9,-32 Q-9,-42 0,-42 Q9,-42 9,-32 L5,-32 Q5,-37 0,-37 Q-5,-37 -5,-32 Z" fill="#d1d5db" stroke="#9ca3af" stroke-width="0.8"/>
    <rect x="-3.5" y="13" width="7" height="18" rx="2.5" fill="#d1d5db" stroke="#9ca3af" stroke-width="0.8"/>
  </g>
  <!-- Hand -->
  <g transform="translate(100,88)">
    <ellipse cx="0" cy="8" rx="16" ry="20" fill="#f5d0a9"/>
    <rect x="-12" y="-3" width="24" height="13" rx="3.5" fill="#f5d0a9"/>
    <!-- Fingers -->
    <rect x="-10" y="-10" width="5.5" height="9" rx="2.5" fill="#f5d0a9"/>
    <rect x="-4" y="-12" width="5.5" height="11" rx="2.5" fill="#f5d0a9"/>
    <rect x="2" y="-11" width="5.5" height="10" rx="2.5" fill="#f5d0a9"/>
    <rect x="8" y="-8" width="5.5" height="7" rx="2.5" fill="#f5d0a9"/>
    <!-- Thumb -->
    <rect x="-16" y="-2" width="7" height="11" rx="3.5" fill="#f5d0a9" transform="rotate(-18 -12 4)"/>
    <!-- Sleeve -->
    <rect x="-14" y="22" width="28" height="16" rx="2.5" fill="#2563eb"/>
    <rect x="-14" y="22" width="28" height="5" rx="2.5" fill="#1e40af"/>
  </g>
  <!-- Text -->
  <text x="100" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold">
    <tspan fill="#1e3a5f">Infra</tspan><tspan fill="#2563eb">Track</tspan>
  </text>
</svg>
